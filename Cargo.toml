[package]
name = "anti-hash"
authors = ["Heltion"]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
malachite = { version = "0.14", features = ["floats"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = [
    "Document", "Element", "Event", "EventTarget", "HtmlButtonElement",
    "HtmlElement", "HtmlFormElement", "HtmlInputElement", "Node", "Window",
] }
