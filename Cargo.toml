[package]
name = "anti-hash"
authors = ["Heltion"]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
malachite = { version = "0.14", features = ["floats"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Element", "Node", "NodeList", "Event", "EventTarget",
    "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "Navigator", "Clipboard",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent",
    "DedicatedWorkerGlobalScope", "WorkerGlobalScope",
] }
